name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dependências mínimas (sem as opcionais de assinatura)
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Run import smoke test
        run: |
          python -c "from xmls_gui_app import certificate_handler, config; from xmls_gui_app.xml_processor import XMLProcessor; from xmls_gui_app.xml_processor_nfe import NFeProcessor; print('All imports OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint with pyflakes
        run: |
          pip install pyflakes
          python -m pyflakes xmls_gui_app/ run_gui.py || true